apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway
  namespace: chaos-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-gateway
  template:
    metadata:
      labels:
        app: payment-gateway
    spec:
      containers:
      - name: gateway
        image: nginx:99.99-nonexistent-tag
        ports:
        - containerPort: 80
