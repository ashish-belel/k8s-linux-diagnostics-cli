apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: chaos-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth
        image: polinux/stress
        resources:
          limits:
            memory: "32Mi"
          requests:
            memory: "16Mi"
        command: ["stress"]
        args: ["--vm", "1", "--vm-bytes", "64M", "--vm-hang", "1"]
